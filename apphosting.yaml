# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# No server-side secrets are required. Visitors can paste their own API keys
# (Gemini, NewsAPI, Apify, Google CSE, stats service URL) on the /connect
# page — they're stored in the browser only and sent with each request.
#
# If you'd rather configure keys once for everyone instead of per-visitor,
# uncomment the block below AFTER creating the secrets and granting the App
# Hosting backend access to them:
#   firebase apphosting:secrets:set NEWS_API_KEY --project thunder-mentions
#   firebase apphosting:secrets:grantaccess NEWS_API_KEY --project thunder-mentions
#   (repeat for GEMINI_API_KEY, APIFY_API_TOKEN, etc.)
#
# env:
#   - variable: NEWS_API_KEY
#     secret: NEWS_API_KEY
#     availability:
#       - RUNTIME
#   - variable: GEMINI_API_KEY
#     secret: GEMINI_API_KEY
#     availability:
#       - RUNTIME
#   - variable: APIFY_API_TOKEN
#     secret: APIFY_API_TOKEN
#     availability:
#       - RUNTIME
