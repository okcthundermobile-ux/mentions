# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets.
# Create the secrets before the first rollout:
#   firebase apphosting:secrets:set NEWS_API_KEY
#   firebase apphosting:secrets:set GEMINI_API_KEY
# The optional article sources (GOOGLE_CSE_KEY / APIFY_API_TOKEN) can be
# added the same way later if you enable them.
env:
  - variable: NEWS_API_KEY
    secret: NEWS_API_KEY
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
