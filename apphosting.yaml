# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# No server-side secrets are required to deploy. Roster & Stats pulls
# directly from ESPN's public API (no key needed) and runs entirely inside
# this Next.js app — no separate service to host. Everything else (Gemini,
# NewsAPI, Apify) is optional: visitors can paste their own keys on the
# /connect page, stored in the browser only and sent with each request.
#
# If you'd rather configure Gemini/NewsAPI/Apify keys once for everyone
# instead of per-visitor, create secrets and grant the App Hosting backend
# access to them, then uncomment an `env:` block like this:
#   firebase apphosting:secrets:set NEWS_API_KEY --project thunder-mentions
#   firebase apphosting:secrets:grantaccess NEWS_API_KEY --project thunder-mentions
#   (repeat for GEMINI_API_KEY, APIFY_API_TOKEN)
#
# env:
#   - variable: NEWS_API_KEY
#     secret: NEWS_API_KEY
#     availability:
#       - RUNTIME
#   - variable: GEMINI_API_KEY
#     secret: GEMINI_API_KEY
#     availability:
#       - RUNTIME
#   - variable: APIFY_API_TOKEN
#     secret: APIFY_API_TOKEN
#     availability:
#       - RUNTIME
